name: ci

on:
  push:
    branches: [main, "perf/**"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, to catch runner image and toolchain drift.
    - cron: "17 3 * * *"

permissions:
  contents: read

# A new push to a pull request cancels its running checks; runs on main,
# nightly and manual runs always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27.4"
  # GOAMD64=v1 keeps AVX2 switchable through GODEBUG=cpu.avx2=off.
  GOAMD64: v1
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Cache WebRTC sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp_check/webrtc-m141
          key: webrtc-m141-${{ hashFiles('scripts/fetch-webrtc.sh') }}
      - name: Fetch WebRTC sources
        run: bash scripts/fetch-webrtc.sh
      - name: clang
        run: |
          command -v clang >/dev/null || { sudo apt-get update && sudo apt-get install -y clang; }
          clang --version
      - name: make lint (gofmt, go vet per build, generated files current)
        run: make lint CLANG_CC=clang CLANG_CXX=clang++
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  # Known vulnerabilities in the module's dependencies and in the standard
  # library of GO_VERSION, in the code the packages and their tests reach.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: govulncheck
        run: make vuln

  # The fuzz targets, FUZZTIME each, and the long config sweep, on the nightly
  # and manual runs. A failing input is in the log and in the artifact:
  # commit it to testdata/fuzz with its fix.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: make fuzz
        run: make fuzz FUZZTIME=10m
      - name: The boundary config sweep with long signal phases
        run: GOAEC3_SWEEP_UNIT=40 GOEXPERIMENT=simd go test -count=1 -run '^TestBoundaryConfigSweep$' .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-crashers
          path: |
            testdata/fuzz
            internal/bands/testdata/fuzz

  test:
    name: test (${{ matrix.os }}, ${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        lane: [default, simd, purego]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test
        run: |
          case "${{ matrix.lane }}" in
            default) go test -count=1 ./... ;;
            simd) GOEXPERIMENT=simd go test -count=1 ./... ;;
            purego) go test -count=1 -tags purego ./... ;;
          esac

  # 32-bit targets, where int has 32 bits: they run the scalar lane.
  test-32bit:
    name: test-32bit (${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goarch: "386" }
          - { os: ubuntu-24.04-arm, goarch: arm }
    runs-on: ${{ matrix.os }}
    env:
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test
        run: go test -count=1 ./...

  # The race detector over the short test suite, with the pure-Go lane
  # references and with the archsimd kernels.
  race:
    name: race (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: default }
          - { lane: simd, experiment: simd }
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: ${{ matrix.experiment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test -race -short
        run: go test -count=1 -race -short ./...

  # The archsimd build on a CPU with AVX but without AVX2 (Sandy Bridge, Ivy
  # Bridge, AMD families 15h and 16h), emulated by QEMU: an AVX2 instruction
  # in a 128-bit kernel faults there. GOAEC3_EXPECT_AVX_ONLY fails the run
  # unless the emulated CPU reports AVX and no AVX2. 256-bit AVX instructions
  # do not fault on such a CPU; TestSimdInstructionsGated proves their
  # absence from the machine code that runs without AVX2.
  avx-only:
    name: avx-only (qemu)
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: simd
      GOAEC3_EXPECT_AVX_ONLY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
          qemu-x86_64 --version
      - name: go test -short on an emulated Sandy Bridge
        run: go test -count=1 -short -timeout 40m -exec 'qemu-x86_64 -cpu SandyBridge' ./...

  # End-to-end (BlockProcessor, EchoCanceller3, public API, the random-config
  # and fuzz-seed differential tests) and per-kernel (matched filter,
  # adaptive filter) parity against the C++ reference built from the pinned
  # WebRTC sources. GOAEC3_EXPECT_LANE makes each job fail if Go or C++ runs
  # another lane than the one named. The avx2-simd job also runs the x86
  # Ooura FFT, spectrum and vector-math kernels against their C++ sources.
  # The jobs marked stock measure goaec3 against the C++ on glibc's libm:
  # reported, not gated, since glibc's exp2f, exp10f and log10f need not be
  # the correctly rounded values goaec3 and the gated oracle use.
  oracle-src:
    name: oracle-src (${{ matrix.os }}, ${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 runners have AVX2 and FMA.
          - { os: ubuntu-latest, name: avx2-simd, lane: avx2, experiment: simd, stock: true }
          - { os: ubuntu-latest, name: avx2, lane: avx2 }
          - { os: ubuntu-latest, name: sse2-simd, lane: sse2, experiment: simd, godebug: cpu.avx2=off }
          - { os: ubuntu-latest, name: sse2, lane: sse2, godebug: cpu.avx2=off }
          - { os: ubuntu-latest, name: scalar, lane: none, tags: purego }
          - { os: ubuntu-24.04-arm, name: neon-simd, lane: neon, experiment: simd, stock: true }
          - { os: ubuntu-24.04-arm, name: neon, lane: neon }
          - { os: ubuntu-24.04-arm, name: scalar, lane: none, tags: purego }
    runs-on: ${{ matrix.os }}
    env:
      CC: clang
      CXX: clang++
      GOEXPERIMENT: ${{ matrix.experiment }}
      GODEBUG: ${{ matrix.godebug }}
      GOAEC3_EXPECT_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Cache WebRTC sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp_check/webrtc-m141
          key: webrtc-m141-${{ hashFiles('scripts/fetch-webrtc.sh') }}
      - name: Fetch WebRTC sources
        run: bash scripts/fetch-webrtc.sh
      - name: clang
        run: |
          command -v clang >/dev/null || { sudo apt-get update && sudo apt-get install -y clang; }
          clang --version
      - name: Parity against the source-built WebRTC
        run: go test -count=1 -timeout 40m -v -tags "webrtc_src_oracle ${{ matrix.tags }}" ./internal/webrtcoracle/ 2>&1 | grep -v '^=== RUN'
        shell: bash -o pipefail {0}
      - name: x86 kernels against their C++ sources
        if: matrix.name == 'avx2-simd'
        run: go test -count=1 -tags ooura_sse2_oracle ./internal/webrtcoracle/
      - name: Divergence on glibc's libm (reported, not gated)
        if: matrix.stock
        run: go test -count=1 -timeout 40m -v -tags "webrtc_src_oracle webrtc_oracle_stock" -run '^TestEc3StockLibmDivergence$' ./internal/webrtcoracle/ 2>&1 | grep -v '^=== RUN'
        shell: bash -o pipefail {0}
