name: macos

# macOS runners are scarce in this organization and can queue for hours. This
# workflow is separate from ci so a waiting macOS job never holds up the
# required Linux checks; a newer run cancels an older one that is still waiting.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"
  GOTOOLCHAIN: local

jobs:
  macos:
    runs-on: macos-15
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Cache WebRTC sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tmp_check/webrtc-m141
          key: webrtc-m141-${{ hashFiles('scripts/fetch-webrtc.sh') }}
      - name: Fetch WebRTC sources
        run: bash scripts/fetch-webrtc.sh
      - name: go test (default, simd, purego)
        run: |
          go test -count=1 ./...
          GOEXPERIMENT=simd go test -count=1 ./...
          go test -count=1 -tags purego ./...
      - name: Parity against the source-built WebRTC (neon-simd)
        run: GOEXPERIMENT=simd GOAEC3_EXPECT_LANE=neon go test -count=1 -timeout 40m -v -tags webrtc_src_oracle ./internal/webrtcoracle/ 2>&1 | grep -v '^=== RUN'
        shell: bash -o pipefail {0}
      - name: Parity against the source-built WebRTC (scalar)
        run: GOAEC3_EXPECT_LANE=none go test -count=1 -timeout 40m -v -tags "webrtc_src_oracle purego" ./internal/webrtcoracle/ 2>&1 | grep -v '^=== RUN'
        shell: bash -o pipefail {0}
      - name: Bit-exact against the source-built WebRTC on Apple libm
        run: GOEXPERIMENT=simd go test -count=1 -timeout 40m -v -tags "webrtc_src_oracle webrtc_oracle_stock" -run '^TestEc3StockLibmDivergence$' ./internal/webrtcoracle/ 2>&1 | grep -v '^=== RUN'
        shell: bash -o pipefail {0}
